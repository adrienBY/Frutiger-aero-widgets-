name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties && ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Build release APKs
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "error:|e: |What went wrong|AAPT" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk AeroClock-${{ github.run_number }}.apk
          cp iconpack/build/outputs/apk/release/iconpack-release.apk AeroIcons-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aero build ${{ github.run_number }}
          files: |
            AeroClock-${{ github.run_number }}.apk
            AeroIcons-${{ github.run_number }}.apk
          make_latest: true
